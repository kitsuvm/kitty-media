[package]
name = "kitty-media"
version = "0.1.0"
edition = "2024"
description = "Post-upload media processing tool."
authors = ["Kitsu/VM <contact@kitsuvm.com>"]
license = "MIT"
repository = "https://github.com/kitsuvm/kitty-media"
keywords = ["media", "video", "image", "audio", "processing"]
categories = ["multimedia", "multimedia::audio", "multimedia::video", "multimedia::images", "api-bindings"]

[workspace]
resolver = "3"
members = [".", "migration/remote"]

[features]
database = ["dep:sea-orm", "serde", "dep:rmp-serde", "dep:migration-remote", "dep:snowflaked", "dep:time"]
default = ["http-server", "postgres", "logger", "mysql"]
http-client = ["dep:reqwest", "serde", "dep:serde_json"]
http-server = ["dep:actix-web", "serde", "dep:serde_json", "database", "media-engine", "dep:futures-util"]
logger = ["dep:tracing-subscriber"]
media-engine = []
mysql = ["sea-orm/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres"]
serde = ["dep:serde"]

[lib]

[[bin]]
name = "kitty-media"
required-features = ["http-server"]

[[bin]]
name = "kitty-media-test"
required-features = ["http-client"]

[dependencies]
actix-web = { version = "4.20.0", optional = true, default-features = false, features = ["macros"] }
futures-util = { version = "0.3.34", optional = true }
migration-remote = { optional = true, path = "migration/remote" }
reqwest = { version = "0.13.5", optional = true, features = ["json"] }
rmp-serde = { version = "1.3.1", optional = true }
sea-orm = { version = "2.0.0", optional = true, default-features = true, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-time"] }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
snowflaked = { version = "1.0.4", optional = true }
time = { version = "0.3.55", optional = true, features = ["macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true, features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
